<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Trade Tracker — Dashboard Explorations</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    /* artboard card follows the theme so there's no white flash in dark mode */
    :root { --ab-bg: #f6f7f9; }
    html.dark { --ab-bg: #0e1116; }
    .dc-card { background: var(--ab-bg) !important; }
    html.dark .design-canvas { background: #14171c !important; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- data first (plain script), then babel component files -->
  <script src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="variation1.jsx"></script>
  <script type="text/babel" src="variation2.jsx"></script>
  <script type="text/babel" src="variation3.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas minScale={0.08} maxScale={2}>
          <DCSection id="dash"
            title="Options Trade Tracker — Dashboard"
            subtitle="Three layout directions · toggle light/dark bottom-right · click ⤢ on any board to focus">
            <DCArtboard id="v1" label="1 · Classic Terminal" width={1440} height={1040}>
              <Variation1 />
            </DCArtboard>
            <DCArtboard id="v2" label="2 · Curve-Forward" width={1440} height={860}>
              <Variation2 />
            </DCArtboard>
            <DCArtboard id="v3" label="3 · Dense Bento" width={1440} height={884}>
              <Variation3 />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- floating theme toggle (vanilla, lives above the canvas) -->
  <script>
    (function () {
      var KEY = 'ott-theme';
      var sun = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>';
      var moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var btn = document.createElement('button');
      btn.id = 'theme-toggle';
      function render() {
        var dark = document.documentElement.classList.contains('dark');
        btn.innerHTML = (dark ? sun : moon) + '<span>' + (dark ? 'Light' : 'Dark') + '</span>';
      }
      function apply(dark) {
        document.documentElement.classList.toggle('dark', dark);
        try { localStorage.setItem(KEY, dark ? 'dark' : 'light'); } catch (e) {}
        render();
      }
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      apply(saved === 'dark');
      btn.addEventListener('click', function () {
        apply(!document.documentElement.classList.contains('dark'));
      });
      document.body.appendChild(btn);
    })();
  </script>
</body>
</html>
